# XcodeGen spec (https://github.com/yonaskolb/XcodeGen): `xcodegen generate` in this folder
# creates DaybreakStageViewer.xcodeproj. Manual setup without XcodeGen: see README.md.
name: DaybreakStageViewer
options:
  bundleIdPrefix: io.github.autumn26614
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  DaybreakStageViewer:
    type: application
    platform: iOS
    sources:
      - path: DaybreakStageViewer
      - path: ../src
        excludes:
          - stageinfo.cpp   # CLI entry point (has its own main)
          - png.cpp         # PNG writer used only by the CLI
          - png.h
      - path: Fixtures      # synthetic fixture.dat, used with -useBundledFixture
        buildPhase: resources
    info:
      path: DaybreakStageViewer/Info.plist
      properties:
        CFBundleDisplayName: Daybreak Stage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Archives copied into the app's folder (Files: On My iPhone > Daybreak Stage, or
        # Finder file sharing) are found at launch; see DocumentsFolder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.autumn26614.DaybreakStageViewer
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        SWIFT_OBJC_BRIDGING_HEADER: DaybreakStageViewer/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../src
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DB_NO_ICONV=1"]

  DaybreakStageViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      - path: Fixtures
        buildPhase: resources
    dependencies:
      - target: DaybreakStageViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.autumn26614.DaybreakStageViewerTests
        GENERATE_INFOPLIST_FILE: YES
        # @testable import of an app that uses a bridging header needs the same header here.
        SWIFT_OBJC_BRIDGING_HEADER: DaybreakStageViewer/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../src

  DaybreakStageViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: DaybreakStageViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.autumn26614.DaybreakStageViewerUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DaybreakStageViewer:
    build:
      targets:
        DaybreakStageViewer: all
    test:
      config: Debug
      targets:
        - DaybreakStageViewerTests
        - DaybreakStageViewerUITests
