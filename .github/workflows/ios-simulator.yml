# Manually triggered: builds port/ios with XcodeGen and runs the unit + UI tests in the
# iOS Simulator against the synthetic fixture (no game data is needed or used).
# Start it from the Actions tab ("Run workflow") or: gh workflow run ios-simulator.yml
name: iOS simulator test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-simulator.yml', 'port/**']

permissions:
  contents: read

jobs:
  ios-simulator:
    strategy:
      fail-fast: false
      # Intel always. Apple silicon (macos-15) only on a manual run: its jobs have not been
      # getting workers for this repository (queued, then cancelled), which would mark
      # every push run as failed.
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '[{"runner":"macos-15-intel","arch":"x86_64","experimental":false},{"runner":"macos-15","arch":"arm64","experimental":true}]'
          || '[{"runner":"macos-15-intel","arch":"x86_64","experimental":false}]') }}
    name: ios-simulator (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          python3 --version

      - name: Fixture is reproducible from port/tools/make_fixture.py
        run: |
          python3 port/tools/make_fixture.py "$RUNNER_TEMP/fixture.dat" "$RUNNER_TEMP/fixture-overlay.dat"
          cmp port/ios/Fixtures/fixture.dat "$RUNNER_TEMP/fixture.dat"
          cmp port/ios/Fixtures/fixture-overlay.dat "$RUNNER_TEMP/fixture-overlay.dat"

      - name: C API check on macOS (clang, same fixture)
        working-directory: port
        run: |
          make CXX=clang++ CC=clang
          file build/capi_test
          file build/capi_test | grep -q "${{ matrix.arch }}"
          build/capi_test ios/Fixtures/fixture.dat 1 fixture
          make CXX=clang++ CC=clang test
          make CXX=clang++ CC=clang noiconv
          make CXX=clang++ CC=clang asan

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: port/ios
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 port/ios/ci/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boot before xcodebuild so the first UI query does not race the boot.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and test in the iOS Simulator
        working-directory: port/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project DaybreakStageViewer.xcodeproj \
            -scheme DaybreakStageViewer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
