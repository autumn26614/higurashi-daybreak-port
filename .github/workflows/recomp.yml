# The static recompilation runtime on Apple's toolchain, without any game data: the
# runtime (with the Metal renderer and CoreText glyphs) compiles for macOS and the iOS
# simulator, and the Metal Shading Language it generates compiles with Apple's compiler.
name: recomp (Apple toolchain)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recomp.yml', 'recomp/**']

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Runtime compiles (macOS)
        working-directory: recomp
        run: |
          set -e
          mkdir -p /tmp/o
          for f in runtime/*.cpp; do
            clang++ -std=c++17 -O1 -Wall -Wno-unused-parameter -Iruntime -c "$f" -o "/tmp/o/$(basename "$f").o"
          done
          for f in runtime/*.mm; do
            clang++ -std=c++17 -O1 -fobjc-arc -Wall -Wno-unused-parameter -Iruntime -c "$f" -o "/tmp/o/$(basename "$f").o"
          done
          ls /tmp/o

      - name: Runtime compiles (iOS simulator)
        working-directory: recomp
        run: |
          set -e
          SDK=$(xcrun -sdk iphonesimulator --show-sdk-path)
          mkdir -p /tmp/s
          for f in runtime/*.cpp runtime/*.mm; do
            xcrun -sdk iphonesimulator clang++ -target x86_64-apple-ios16.0-simulator -isysroot "$SDK" -std=c++17 -O1 \
              -fobjc-arc -Wall -Wno-unused-parameter -Iruntime -c "$f" -o "/tmp/s/$(basename "$f").o"
          done

      - name: Generated Metal Shading Language compiles
        working-directory: recomp
        run: |
          set -e
          clang++ -std=c++17 -Iruntime tools/msl_check.cpp runtime/msl.cpp runtime/shader.cpp -o /tmp/msl_check
          mkdir -p /tmp/msl
          /tmp/msl_check /tmp/msl
          for f in /tmp/msl/*.metal; do
            echo "== $f"
            xcrun -sdk iphonesimulator metal -std=ios-metal2.4 -c "$f" -o "/tmp/msl/$(basename "$f" .metal).air"
          done

      - name: Metal renderer against the software renderer (synthetic scene)
        working-directory: recomp
        run: |
          set -e
          mkdir -p /tmp/rt /tmp/render
          for f in runtime/*.cpp runtime/*.mm runtime/gen_stub.c tests/render_test.mm; do
            case "$f" in runtime/main.cpp) continue;; esac
            clang++ -x $(case "$f" in *.mm) echo objective-c++;; *.c) echo c;; *) echo c++;; esac)               $(case "$f" in *.c) echo -std=c11;; *) echo -std=c++17 -fobjc-arc;; esac) -O1 -w -Iruntime               -c "$f" -o "/tmp/rt/$(basename "$f").o"
          done
          clang++ /tmp/rt/*.o -o /tmp/render_test -framework Metal -framework QuartzCore -framework CoreText             -framework CoreGraphics -framework Foundation -liconv
          /tmp/render_test /tmp/render

      - name: Rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-test
          path: /tmp/render/*.png
          retention-days: 7

  ios-app:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: App builds without the game code (iOS simulator)
        working-directory: recomp/ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project DaybreakRecomp.xcodeproj -scheme DaybreakRecomp \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -40
