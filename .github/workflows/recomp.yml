# The static recompilation runtime on Apple's toolchain, without any game data: the
# runtime (with the Metal renderer and CoreText glyphs) compiles for macOS and the iOS
# simulator, and the Metal Shading Language it generates compiles with Apple's compiler.
name: recomp (Apple toolchain)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recomp.yml', 'recomp/**']

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Runtime compiles (macOS)
        working-directory: recomp
        run: |
          set -e
          mkdir -p /tmp/o
          for f in runtime/*.cpp; do
            clang++ -std=c++17 -O1 -Wall -Wno-unused-parameter -Iruntime -c "$f" -o "/tmp/o/$(basename "$f").o"
          done
          for f in runtime/*.mm; do
            clang++ -std=c++17 -O1 -fobjc-arc -Wall -Wno-unused-parameter -Iruntime -c "$f" -o "/tmp/o/$(basename "$f").o"
          done
          ls /tmp/o

      - name: Runtime compiles (iOS simulator)
        working-directory: recomp
        run: |
          set -e
          SDK=$(xcrun -sdk iphonesimulator --show-sdk-path)
          mkdir -p /tmp/s
          for f in runtime/*.cpp runtime/*.mm; do
            xcrun -sdk iphonesimulator clang++ -target x86_64-apple-ios16.0-simulator -isysroot "$SDK" -std=c++17 -O1 \
              -fobjc-arc -Wall -Wno-unused-parameter -Iruntime -c "$f" -o "/tmp/s/$(basename "$f").o"
          done

      - name: Generated Metal Shading Language compiles
        working-directory: recomp
        run: |
          set -e
          clang++ -std=c++17 -Iruntime tools/msl_check.cpp runtime/msl.cpp runtime/shader.cpp -o /tmp/msl_check
          mkdir -p /tmp/msl
          /tmp/msl_check /tmp/msl
          for f in /tmp/msl/*.metal; do
            echo "== $f"
            xcrun -sdk iphonesimulator metal -std=ios-metal2.4 -c "$f" -o "/tmp/msl/$(basename "$f" .metal).air"
          done

      - name: Metal renderer against the software renderer (synthetic scene)
        working-directory: recomp
        run: |
          set -e
          mkdir -p /tmp/rt /tmp/render
          for f in runtime/*.cpp runtime/*.mm runtime/gen_stub.c tests/render_test.mm; do
            if [ "$f" = runtime/main.cpp ]; then continue; fi
            lang="c++ -std=c++17"
            if [ "${f%.mm}" != "$f" ]; then lang="objective-c++ -std=c++17 -fobjc-arc"; fi
            if [ "${f%.c}" != "$f" ]; then lang="c -std=c11"; fi
            clang++ -x $lang -O1 -w -Iruntime -c "$f" -o "/tmp/rt/$(basename "$f").o"
          done
          clang++ /tmp/rt/*.o -o /tmp/render_test -framework Metal -framework QuartzCore -framework CoreText             -framework CoreGraphics -framework Foundation -liconv
          /tmp/render_test /tmp/render

      - name: Shims and flag helpers (macOS)
        working-directory: recomp
        run: |
          set -e
          objs=$(ls /tmp/rt/*.o | grep -v render_test)
          clang++ -std=c++17 -O1 -w -Iruntime tests/shims_test.cpp $objs -o /tmp/shims_test             -framework Metal -framework QuartzCore -framework CoreText -framework CoreGraphics -framework Foundation -liconv
          /tmp/shims_test
          clang++ -std=c++17 -O1 -w -Iruntime tests/flags_test.cpp -o /tmp/flags_test
          /tmp/flags_test

      - name: Rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-test
          path: /tmp/render/*.png
          retention-days: 7

  ios-app:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: App builds without the game code (iOS simulator)
        working-directory: recomp/ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build -project DaybreakRecomp.xcodeproj -scheme DaybreakRecomp \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tail -40

      # The controls cannot be seen without a Mac: run the app in the simulator with its
      # preview launch arguments (the controls over a stand-in picture, then the settings
      # panel) and keep the screenshots.
      - name: Screenshots of the controls (iPhone and iPad simulators)
        working-directory: recomp/ios
        run: |
          app=build/dd/Build/Products/Debug-iphonesimulator/DaybreakRecomp.app
          mkdir -p shots
          for family in iPhone iPad; do
            udid=$(xcrun simctl list devices available | grep -m1 "^ *$family" | grep -oE '[0-9A-F-]{36}')
            [ -n "$udid" ] || continue
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid"
            xcrun simctl install "$udid" "$app"
            for mode in controlsPreview controlsPanel; do
              xcrun simctl launch "$udid" io.github.autumn26614.daybreak.recomp "-$mode"
              sleep 8
              xcrun simctl io "$udid" screenshot "shots/$family-$mode.png"
              xcrun simctl terminate "$udid" io.github.autumn26614.daybreak.recomp
            done
            xcrun simctl shutdown "$udid"
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controls-screenshots
          path: recomp/ios/shots
